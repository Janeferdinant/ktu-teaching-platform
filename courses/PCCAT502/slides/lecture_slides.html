<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCCAT502: INTRODUCTION TO ARTIFICIAL INTELLIGENCE - Lecture Slide Deck | Jane Rose</title>
  <link rel="stylesheet" href="../../../shared-components/themes/liquid-glass.css">
  <style>
    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .slide-header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
    }
    .slide-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .slide-card {
      width: 100%;
      max-width: 950px;
      min-height: 520px;
      padding: 3rem;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .slide-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      margin: 0.5rem 0 1.5rem 0;
      color: var(--accent-primary);
    }
    .slide-body {
      font-size: 1.15rem;
      line-height: 1.8;
      color: var(--text-secondary);
      flex: 1;
    }
    .slide-body ul {
      padding-left: 1.5rem;
    }
    .slide-body li {
      margin-bottom: 0.8rem;
    }
    .slide-code {
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      color: #38bdf8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 1rem;
      overflow-x: auto;
    }
    .slide-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .slide-progress {
      font-weight: 600;
      color: var(--accent-primary);
    }
    .branding-footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      border-top: 1px solid var(--glass-border);
      background: var(--glass-bg);
    }
    @media print {
      body { background: #fff !important; color: #000 !important; }
      .slide-card { page-break-after: always; border: 1px solid #ccc; box-shadow: none; background: #fff !important; color: #000 !important; }
      .slide-header, .slide-controls, .branding-footer { display: none !important; }
    }
  </style>
</head>
<body class="theme-liquid">
  <header class="slide-header">
    <div>
      <span class="glass-badge">PCCAT502 &bull; S5</span>
      <h2 style="margin: 0.3rem 0 0; font-family: var(--font-heading); font-size: 1.25rem;">INTRODUCTION TO ARTIFICIAL INTELLIGENCE &bull; Presentation Slide Deck</h2>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="glass-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
      <a href="/courses/PCCAT502/" onclick="if(location.protocol==='file:'){window.open('../website/index.html');return false;}" class="glass-btn">🏠 Back to Course</a>
    </div>
  </header>

  <main class="slide-container">
    <div class="slide-card" id="slide-content">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <footer class="branding-footer">
    Jane Rose | Asst. Professor | CSE &bull; APJ Abdul Kalam Technological University
  </footer>

  <script src="../../../shared-components/themes/theme-switcher.js"></script>
  <script>
    const slides = [{"module": "Course Overview", "title": "PCCAT502: INTRODUCTION TO ARTIFICIAL INTELLIGENCE", "badge": "S5 \u2022 4 Credits \u2022 KTU 2024 Scheme", "points": ["<strong>Curriculum Regulation:</strong> APJ Abdul Kalam Technological University B.Tech 2024 Scheme.", "<strong>Credit & Hours Distribution:</strong> 4 Credits \u2022 L:T:P:R = 3:1:0:0 \u2022 46 Total Hours (44 Contact + 2 Revision).", "<strong>Assessment Framework:</strong> Continuous Internal Evaluation (CIE) 40 Marks | End Semester Examination (ESE) 60 Marks.", "<strong>Academic Prerequisites:</strong> Prescribed foundational knowledge: NIL."], "code": "// KTU Course Specification\nCourse: PCCAT502 - INTRODUCTION TO ARTIFICIAL INTELLIGENCE\nStructure: 4 Modules x 11 Hours = 44 Contact Hrs + 2 Tutorial/Exam Hours = 46 Hours Total"}, {"module": "Module 1", "title": "Module 1: (Written)  Internal  Examination- 2  (Written )  Internal  E", "badge": "5 Contact Hours \u2022 KTU Prescribed", "points": ["<strong>Module 1 Focus:</strong> (Written)  Internal  Examination- 2  (Written )  Internal  E (5 Contact Hours).", "<strong>Core Syllabus Content:</strong> (Written)  Internal  Examination- 2  (Written )  Internal  Examination- 3  (Lab  Examination)   Total.", "<strong>KTU Examination Alignment:</strong> High-yield derivations, numerical problems, and Bloom's Taxonomy Level K3 applications."], "code": "// Module 1: (Written)  Internal  Examination- 2  (Written )  Internal  E\nInput: Parameters for (Written)  Internal  Examination- 2  (Written )  Internal  E\nProcess: Core transformations conforming to KTU rubrics\nOutput: Verified solution"}, {"module": "Module 2", "title": "Module 2: Core Structural Architecture & Methodologies", "badge": "40 Contact Hours \u2022 KTU Prescribed", "points": ["<strong>Module 2 Focus:</strong> Core Structural Architecture & Methodologies (40 Contact Hours).", "<strong>Core Syllabus Content:</strong> CIE Marks.", "<strong>KTU Examination Alignment:</strong> High-yield derivations, numerical problems, and Bloom's Taxonomy Level K3 applications."], "code": "// Module 2: Core Structural Architecture & Methodologies\nInput: Parameters for Core Structural Architecture & Methodologies\nProcess: Core transformations conforming to KTU rubrics\nOutput: Verified solution"}, {"module": "Module 3", "title": "Module 3: (Lab  Examination)   Total", "badge": "5 Contact Hours \u2022 KTU Prescribed", "points": ["<strong>Module 3 Focus:</strong> (Lab  Examination)   Total (5 Contact Hours).", "<strong>Core Syllabus Content:</strong> (Lab  Examination)   Total.", "<strong>KTU Examination Alignment:</strong> High-yield derivations, numerical problems, and Bloom's Taxonomy Level K3 applications."], "code": "// Module 3: (Lab  Examination)   Total\nInput: Parameters for (Lab  Examination)   Total\nProcess: Core transformations conforming to KTU rubrics\nOutput: Verified solution"}, {"module": "Module 4", "title": "Module 4: Industry Applications & Optimization", "badge": "2 Contact Hours \u2022 KTU Prescribed", "points": ["<strong>Module 4 Focus:</strong> Industry Applications & Optimization (2 Contact Hours).", "<strong>Core Syllabus Content:</strong> Exam Hours.", "<strong>KTU Examination Alignment:</strong> High-yield derivations, numerical problems, and Bloom's Taxonomy Level K3 applications."], "code": "// Module 4: Industry Applications & Optimization\nInput: Parameters for Industry Applications & Optimization\nProcess: Core transformations conforming to KTU rubrics\nOutput: Verified solution"}, {"module": "Assessment & Revision", "title": "46-Hour Progression & Exam Strategy", "badge": "Lectures 45-46 \u2022 University Exam Preparation", "points": ["<strong>Comprehensive Revision:</strong> Lecture 45 focuses on board numerical derivations and worked problems across Modules 1 to 4.", "<strong>Model University Exam:</strong> Lecture 46 covers simulated 60-mark KTU assessment strategy and mark distribution breakdown.", "<strong>Part A Strategy:</strong> 8 compulsory short-answer questions (3 marks each = 24 marks) spanning all modules.", "<strong>Part B Strategy:</strong> 4 choice-based analytical derivations and algorithmic design questions (9 marks each = 36 marks)."], "code": "// KTU 60-Mark University Assessment Matrix\nPart A: 8 Questions x 3 Marks = 24 Marks (Compulsory)\nPart B: 4 Questions x 9 Marks = 36 Marks (Choice from Modules 1-4)\nTotal: 60 Marks | Duration: 2.5 Hours"}];
    let currentSlide = 0;

    function renderSlide(idx) {
      const s = slides[idx];
      const card = document.getElementById('slide-content');
      card.innerHTML = `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="glass-badge">${s.module}</span>
            <span style="font-size: 0.88rem; color: var(--text-muted);">${s.badge}</span>
          </div>
          <h1 class="slide-title">${s.title}</h1>
          <div class="slide-body">
            <ul>
              ${s.points.map(p => `<li>${p}</li>`).join('')}
            </ul>
            ${s.code ? `<div class="slide-code">${s.code}</div>` : ''}
          </div>
        </div>
        <div class="slide-controls">
          <button class="glass-btn" onclick="prevSlide()" ${idx === 0 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>&larr; Previous</button>
          <span class="slide-progress">Slide ${idx + 1} of ${slides.length}</span>
          <button class="glass-btn glass-btn-primary" onclick="nextSlide()" ${idx === slides.length - 1 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>Next &rarr;</button>
        </div>
      `;
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide(currentSlide);
  </script>
</body>
</html>
