<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCCST303: Data Structures & Algorithms - Lecture Slide Deck | Jane Rose</title>
  <link rel="stylesheet" href="../../../shared-components/themes/liquid-glass.css">
  <style>
    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .slide-header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
    }
    .slide-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .slide-card {
      width: 100%;
      max-width: 950px;
      min-height: 520px;
      padding: 3rem;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .slide-badge {
      align-self: flex-start;
      margin-bottom: 1rem;
    }
    .slide-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      margin: 0 0 1.5rem 0;
      color: var(--accent-primary);
    }
    .slide-body {
      font-size: 1.15rem;
      line-height: 1.8;
      color: var(--text-secondary);
      flex: 1;
    }
    .slide-body ul {
      padding-left: 1.5rem;
    }
    .slide-body li {
      margin-bottom: 0.8rem;
    }
    .slide-code {
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: #38bdf8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 1rem;
      overflow-x: auto;
    }
    .slide-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .slide-progress {
      font-weight: 600;
      color: var(--accent-primary);
    }
    .branding-footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      border-top: 1px solid var(--glass-border);
      background: var(--glass-bg);
    }
    @media print {
      body { background: #fff !important; color: #000 !important; }
      .slide-card { page-break-after: always; border: 1px solid #ccc; box-shadow: none; background: #fff !important; color: #000 !important; }
      .slide-header, .slide-controls, .branding-footer { display: none !important; }
    }
  </style>
</head>
<body class="theme-liquid">
  <header class="slide-header">
    <div>
      <span class="glass-badge">PCCST303 &bull; S3 CSE</span>
      <h2 style="margin: 0.3rem 0 0; font-family: var(--font-heading); font-size: 1.25rem;">Data Structures and Algorithms &bull; Lecture Presentation Deck</h2>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="glass-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
      <a href="/courses/PCCST303/" onclick="if(location.protocol==='file:'){window.open('../website/index.html');return false;}" class="glass-btn">🏠 Back to Course</a>
    </div>
  </header>

  <main class="slide-container">
    <div class="slide-card" id="slide-content">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <footer class="branding-footer">
    Jane Rose | Asst. Professor | CSE &bull; APJ Abdul Kalam Technological University (KTU)
  </footer>

  <script src="../../../shared-components/themes/theme-switcher.js"></script>
  <script>
    const slides = [
      {
        module: "Module 1",
        title: "Abstract Data Types & Asymptotic Complexity",
        badge: "Lecture 1-3 &bull; Core Foundations",
        points: [
          "<strong>Data Abstraction:</strong> Separating interface specifications (what it does) from implementation details (how it stores data).",
          "<strong>Axiomatic ADT:</strong> Mathematically specifying operations with preconditions and postconditions (e.g. Stack, Queue, List).",
          "<strong>Asymptotic Bounds:</strong> Big-O (upper bound worst case), Big-Omega (lower bound best case), Big-Theta (tight bound).",
          "<strong>Recurrence Analysis:</strong> Estimating loop runtimes using formal summation and step-count tables."
        ],
        code: "// Big-O Definition: f(n) <= c * g(n) for all n >= n0\n// Example: 3n^2 + 5n + 7 = O(n^2) where c = 15, n0 = 1"
      },
      {
        module: "Module 1",
        title: "Sparse Matrices & Fast Transpose",
        badge: "Lecture 6-7 &bull; Memory Optimization",
        points: [
          "<strong>3-Tuple Representation:</strong> Storing sparse matrices in a table of (Row, Col, Value) triplets with metadata at row 0.",
          "<strong>Memory Savings:</strong> Reduces memory footprint from O(Rows &times; Cols) to O(Non-Zero elements).",
          "<strong>Fast Transpose Algorithm:</strong> Pre-calculates <code>row_terms</code> (column frequency) and <code>starting_pos</code> (prefix sums).",
          "<strong>Optimal Runtime:</strong> Achieves transpose in O(Cols + NonZero) time vs naive O(Cols &times; NonZero)."
        ],
        code: "// Starting position formula:\nstarting_pos[0] = 1;\nfor (i = 1; i < total_cols; i++)\n    starting_pos[i] = starting_pos[i-1] + row_terms[i-1];"
      },
      {
        module: "Module 1",
        title: "Expression Evaluation using Stacks",
        badge: "Lecture 10-11 &bull; Compilers & Runtime",
        points: [
          "<strong>Operator Precedence & Associativity:</strong> Controlling parsing order without ambiguous parenthesization.",
          "<strong>Infix to Postfix (Shunting-Yard):</strong> Operands route directly to output; operators queue on stack by precedence.",
          "<strong>Postfix Evaluation:</strong> Scan expression; push operands; on encountering operator, pop two operands, evaluate, and push result.",
          "<strong>Zero Parentheses:</strong> Postfix expressions execute unambiguously in single linear O(n) passes."
        ],
        code: "// Postfix evaluation step:\nop2 = pop(); op1 = pop();\nresult = evaluate(op1, operator, op2);\npush(result);"
      },
      {
        module: "Module 2",
        title: "Linked Lists & Memory Management",
        badge: "Lecture 12-22 &bull; Dynamic Structures",
        points: [
          "<strong>Singly & Doubly Linked Lists:</strong> Dynamic heap allocation with O(1) head insertion without memory shifting.",
          "<strong>Circular Linked Lists:</strong> Wrap-around traversal; maintenance of <code>last</code> pointer gives O(1) front and rear access.",
          "<strong>Dynamic Allocation Heuristics:</strong> First-Fit (fastest), Best-Fit (tightest fit), Worst-Fit (leaves largest remainder).",
          "<strong>Garbage Collection:</strong> Reference counting vs Mark-Sweep; resolving circular references and heap compaction."
        ],
        code: "// Doubly Linked List 4-pointer insertion before node:\nnewNode->next = curr;\nnewNode->prev = curr->prev;\ncurr->prev->next = newNode;\ncurr->prev = newNode;"
      },
      {
        module: "Module 3",
        title: "Binary Search Trees, Heaps & Graphs",
        badge: "Lecture 23-33 &bull; Hierarchical Structures",
        points: [
          "<strong>Binary Search Tree Property:</strong> Left Subtree &lt; Root &lt; Right Subtree; Inorder traversal gives sorted order.",
          "<strong>BST Deletion (3 Cases):</strong> Leaf deletion, single-child bypass, two-child replacement with Inorder Successor.",
          "<strong>Binary Heaps:</strong> Complete binary tree array representation; Max-Heap maintains <code>A[parent(i)] >= A[i]</code>.",
          "<strong>Graph Traversals:</strong> Breadth-First Search (Queue, level-order, shortest path) vs Depth-First Search (Stack/recursion)."
        ],
        code: "// Heap array indexing (1-based):\nParent = i / 2;\nLeftChild = 2 * i;\nRightChild = 2 * i + 1;"
      },
      {
        module: "Module 4",
        title: "Sorting, Searching & Hashing",
        badge: "Lecture 34-44 &bull; Algorithms & Hashing",
        points: [
          "<strong>Comparison Sorting:</strong> Quick Sort (O(n log n) average, in-place), Merge Sort (guaranteed O(n log n), stable), Heap Sort.",
          "<strong>Radix Sort:</strong> Non-comparative digit distribution sort achieving O(d(n + b)) runtime.",
          "<strong>Binary Search:</strong> Logarithmic search halving candidate space; O(log n) time.",
          "<strong>Collision Resolution:</strong> Linear probing, Quadratic probing, Double hashing, and Open hashing (Separate Chaining)."
        ],
        code: "// Linear Probing: h(k, i) = (h'(k) + i) % m\n// Quadratic Probing: h(k, i) = (h'(k) + c1*i + c2*i^2) % m\n// Separate Chaining: Array of Linked Lists with load factor alpha = n/m"
      }
    ];

    let currentSlide = 0;

    function renderSlide(idx) {
      const s = slides[idx];
      const card = document.getElementById('slide-content');
      card.innerHTML = `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="glass-badge">${s.module}</span>
            <span style="font-size: 0.88rem; color: var(--text-muted);">${s.badge}</span>
          </div>
          <h1 class="slide-title">${s.title}</h1>
          <div class="slide-body">
            <ul>
              ${s.points.map(p => `<li>${p}</li>`).join('')}
            </ul>
            <div class="slide-code">${s.code}</div>
          </div>
        </div>
        <div class="slide-controls">
          <button class="glass-btn" onclick="prevSlide()" ${idx === 0 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>&larr; Previous</button>
          <span class="slide-progress">Slide ${idx + 1} of ${slides.length}</span>
          <button class="glass-btn glass-btn-primary" onclick="nextSlide()" ${idx === slides.length - 1 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>Next &rarr;</button>
        </div>
      `;
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide(currentSlide);
  </script>
</body>
</html>
